events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings with JSON format for log ingestion (ELK / Loki)
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M; # Support high-res PDF & cryptographic evidence uploads

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting Zones (Leaky Bucket)
    # 1. API general rate limit: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=100r/m;
    # 2. PayPal Webhook burst limit: 30 requests per second per IP
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
    # 3. Connection limit: Max 20 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Backend Pool (Stateless Go API Gateway Cluster)
    upstream backend_api {
        least_conn; # Load balance based on least active connections
        server server-1:8080 max_fails=3 fail_timeout=10s;
        server server-2:8080 max_fails=3 fail_timeout=10s;
        keepalive 64; # Keep connections alive to backend to cut TCP handshake overhead
    }

    # Upstream Frontend Pool
    upstream frontend_client {
        server client:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Global Connection Limits
        limit_conn conn_limit 30;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Healthcheck Endpoint (Used by Load Balancer / Kubernetes)
        location /healthz {
            access_log off;
            return 200 '{"status":"healthy","service":"proofrail-gateway"}\n';
            add_header Content-Type application/json;
        }

        # 2. PayPal Webhook Ingress (High-throughput, separate burst control)
        location /api/v1/webhooks/paypal {
            limit_req zone=webhook_limit burst=50 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering for webhook validation
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # 3. Standard API Requests (JWT Auth, Ledger, Dossiers)
        location /api {
            limit_req zone=api_general_limit burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # 4. Uploaded Evidence File Serving (With caching)
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_cache_valid 200 304 12h;
            add_header Cache-Control "public, max-age=43200, immutable";
            expires 12h;
        }

        # 5. React Frontend SPA Routing
        location / {
            proxy_pass http://frontend_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA HTML5 History mode fallback handled by client container
        }
    }
}


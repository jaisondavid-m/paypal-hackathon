version: '3.8'

services:
  # =========================================================================
  # 1. Edge Load Balancer & Ingress Gateway (Nginx)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: proofrail-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-1
      - server-2
      - client
    networks:
      - proofrail-net

  # =========================================================================
  # 2. Frontend React Single-Page Application
  # =========================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: proofrail-client
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proofrail-net

  # =========================================================================
  # 3. Stateless API Cluster Replicas (Go Web Gateway)
  # =========================================================================
  server-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proofrail-server-1
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_DRIVER: mysql
      DB_DSN: "proofrail:proofrailpassword@tcp(mysql:3306)/proofrail_db?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      JWT_SECRET: "proofrail-enterprise-jwt-secret-2026-hackathon"
      PAYPAL_BASE_URL: "https://api-m.sandbox.paypal.com"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      APP_URL: "http://localhost"
      STORAGE_DIR: "./uploads"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - proofrail-net

  server-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proofrail-server-2
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_DRIVER: mysql
      DB_DSN: "proofrail:proofrailpassword@tcp(mysql:3306)/proofrail_db?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      JWT_SECRET: "proofrail-enterprise-jwt-secret-2026-hackathon"
      PAYPAL_BASE_URL: "https://api-m.sandbox.paypal.com"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      APP_URL: "http://localhost"
      STORAGE_DIR: "./uploads"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - proofrail-net

  # =========================================================================
  # 4. Asynchronous Event Worker Fleet (Kafka Consumer & Redis Batch Flusher)
  # =========================================================================
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proofrail-worker
    command: ["./server", "--worker"]
    restart: unless-stopped
    environment:
      WORKER_MODE: "true"
      DB_DRIVER: mysql
      DB_DSN: "proofrail:proofrailpassword@tcp(mysql:3306)/proofrail_db?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - proofrail-net

  # =========================================================================
  # 5. Distributed Event Bus (Apache Kafka - KRaft Mode)
  # =========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: proofrail-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "4L622nShTUiT8YTrQ3hTWg"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - proofrail-net

  # Optional Kafka Monitoring UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: proofrail-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: proofrail-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - proofrail-net

  # =========================================================================
  # 6. Ultra-Fast L1 Cache & Write-Behind Buffer (Redis 7)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: proofrail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - proofrail-net

  # Optional Redis Web GUI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: proofrail-redis-commander
    restart: unless-stopped
    ports:
      - "8086:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proofrail-net

  # =========================================================================
  # 7. ACID Relational Database (MySQL 8.0)
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: proofrail-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --max_connections=500
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: proofrail_db
      MYSQL_USER: proofrail
      MYSQL_PASSWORD: proofrailpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - proofrail-net

volumes:
  mysql_data:
  redis_data:
  kafka_data:

networks:
  proofrail-net:
    driver: bridge

